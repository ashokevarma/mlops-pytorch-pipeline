model:
  architecture: resnet18   # resnet18 | simple_cnn
  num_classes: 10

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3
  seed: 42
  max_train_batches: 0   # 0 = full dataset
  max_val_batches: 0

data:
  dataset: cifar10
  data_dir: /app/data
  num_workers: 4

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
